      - name: Install dependencies
        working-directory: ai-studio-apk
        run: npm install

      - name: Add Android platform
        working-directory: ai-studio-apk
        run: npx cap add android

      - name: Sync web assets
        working-directory: ai-studio-apk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ai-studio-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-apk
          path: ai-studio-apk/android/app/build/outputs/apk/debug/app-debug.apk
