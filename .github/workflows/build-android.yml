name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Put the game in www/
        run: |
          mkdir -p www
          cp brain-puzzle-hard.html www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Add and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate app icons
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('resources/icon.svg').resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('icon ok'))"
          npx --yes @capacitor/assets generate --android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: brain-puzzle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
