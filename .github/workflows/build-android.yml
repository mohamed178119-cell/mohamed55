name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare game files
        shell: bash
        working-directory: desktop
        run: cp ../brain-puzzle-hard.html index.html

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build portable EXE
        working-directory: desktop
        run: npx electron-builder --win portable

      - uses: actions/upload-artifact@v4
        with:
          name: brain-puzzle-exe
          path: desktop/dist/*.exe
