name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate project and unzip if needed
        id: locate
        run: |
          for f in $(find . -iname "*.zip" -not -path "./.git/*"); do
            echo "Unzipping: $f"
            unzip -o "$f" -d "$(dirname "$f")"
          done
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" -not -path "./.git/*" | head -1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: could not find settings.gradle(.kts) anywhere in the repo."
            exit 1
          fi
          echo "Found Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Write .env with API key
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: echo "GEMINI_API_KEY=AQ.Ab8RN6L0H22FiGM3slwSLG6a4cHqJxjAtP-LPdxqtxDVmXy5Ig" > .env

      - name: Generate debug keystore
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
