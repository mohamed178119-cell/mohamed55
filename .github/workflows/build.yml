name: Build Android Debug APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع (الإصدار v4)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17 (الإصدار v4)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد أداة Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      # 4. فك ضغط ملف QuranApp.zip
      - name: Unzip Project
        run: |
          unzip -o QuranApp.zip
          cp -r QuranApp/* . || true

      # 5. إعطاء صلاحية التشغيل للـ gradlew (إن وجد)
      - name: Make gradlew executable
        run: chmod +x gradlew || true

      # 6. تجميع التطبيق
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 7. رفع ملف الـ APK (تم التحديث إلى v4)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
