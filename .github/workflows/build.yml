name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
            if [ -n "$BUILD_FILE" ]; project_dir=$(dirname "$BUILD_FILE"); then
              echo "Found project in $project_dir"
              if [ -f "$project_dir/gradlew" ]; then
                chmod +x "$project_dir/gradlew"
              fi
            fi
          fi

      - name: Build Debug APK
        run: |
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not find build.gradle or build.gradle.kts in repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Building in directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masa-App-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masa-App-Debug-APK
          path: "${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk"
