name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug - Print All Files
        run: |
          echo "=== Root Directory Content ==="
          ls -la
          echo "=== All build files found ==="
          find . -name "*gradle*"

      - name: Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build Debug APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not find build.gradle or build.gradle.kts in repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Building in directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masa-App-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
