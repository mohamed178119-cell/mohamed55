name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d extracted_project
          fi

      - name: Create Debug Keystore
        run: |
          # إنشاء مفتاح توقيع مؤقت لتجاوز خطأ التوقيع
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            mkdir -p "$PROJECT_DIR"
            keytool -genkey -v -keystore "$PROJECT_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not find build.gradle file!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Navigating to project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masa-App-Debug
          path: "**/build/outputs/apk/debug/*.apk"
