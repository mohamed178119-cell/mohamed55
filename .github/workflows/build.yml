name: Build Masa APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate and unzip project
        id: locate
        run: |
          echo "Repo root contents:"
          ls -la

          echo "Unzipping any zip files found (root and subfolders)..."
          find . -iname "*.zip" -not -path "./.git/*" -print0 | while IFS= read -r -d '' f; do
            echo "Unzipping: $f"
            unzip -o "$f" -d "$(dirname "$f")"
          done

          echo "Contents after unzip:"
          find . -maxdepth 4 -not -path "./.git*"

          PROJECT_DIR=$(find . -name "settings.gradle" -not -path "./.git/*" | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: could not find settings.gradle anywhere in the repo."
            echo "Make sure masa-app.zip (or its extracted folder) is committed to the repo."
            exit 1
          fi

          echo "Found Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: find . -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masa-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
