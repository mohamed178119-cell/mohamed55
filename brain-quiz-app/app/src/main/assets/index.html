  if(/رسام|لوحة|موسيقى|موسيقي|مطربة|فنانة|مخرج|فيلم|أوبرا|الفنانة/.test(q)) return 'arts';

  if(/أي كتاب|ما اسم الكتاب|اسم الكتاب|ما اسم الرواية/.test(q)) return 'book_titles';
  if(/عنصر|غاز|ذرة|جسيم|وحدة|قانون|فيتامين|هرمون|عضو|دماغ|الشريان|غدة|مرض|الدم|النبات|لون يمتص|لغة البرمجة|لغة .* صمم|مصطلح/.test(q)) return 'science';
  if(/من.*(كتاب|رواية|مسرحية|ملحمة|مؤلف|ألّف|كتب)|من صاحب|صاحب كتاب|صاحب ديوان|صاحب تفسير/.test(q)) return 'authors';
  if(/عالم|مكتشف|اخترع|مخترع|اكتشف|عزل فيتامين|العالم|طبيب|الطبي|رائد فضاء|أول إنسان|أول امرأة|أول من|مؤسس علم/.test(q)) return 'scientists';

  if(/خليفة|ملك|سلطان|قائد|حاكم|إمبراطور|رئيس|مؤسس|زعيم|صحابي|الملك|أول الخلفاء/.test(q)) return 'historical_figures';

  if(/شهر|مسجد|سورة|قرآن|إسلام|غار|مكان مقدس|أقدس/.test(q)) return 'religion';
  if(/رحالة|مستكشف|رحلة/.test(q)) return 'explorers';
  if(/قمر صناعي|تلسكوب|جهاز|شركة|مخترع الشبكة|لغة البرمجة/.test(q)) return 'technology';
  if(/حضارة|جامعة|مدينة|غار|قصر|قلعة|معبد|مكتبة|سور/.test(q)) return 'historical_places';
  return 'general';
}
const optionPools = {};
for(const item of Q){
  const group = optionGroup(item);
  (optionPools[group] ||= []).push(...item.o);
}
function shuffle(items){
  const a = [...items];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function prepareOptions(question){
  const correct = question.o[question.a];
  const group = optionGroup(question);
  // نضيف خيارين فقط من بنك الأسئلة المصنّف في المجال نفسه.
  const pool = [...new Set(optionPools[group] || [])];
  const distractors = shuffle(pool.filter(v => !question.o.includes(v) && v !== correct));
  const options = [...question.o, ...distractors.slice(0, 2)];
  // إذا لم يتوفر بديلان من نفس المجال، نُبقي الخيارات الأربعة الأصلية بدلاً من إدخال إجابات غير مرتبطة.
  currentOptions = shuffle(options);
  currentAnswer = currentOptions.indexOf(correct);
}

function msg(t){
  const d = document.createElement('div');
  d.className = 'ov';
  d.innerHTML = '<div class="box"><p>' + t + '</p><button class="btn p" onclick="this.parentNode.parentNode.remove()">حسناً</button></div>';
  document.body.appendChild(d);
}

function menu(){
  const debt = S.coins < 0 ? '<div class="debt">رصيدك بالسالب، لازم تعيد مرحلة قديمة عشان ترجع للموجب</div>' : '';
  $('app').innerHTML =
    '<div class="mascot"><svg viewBox="0 0 160 160" width="120" height="120"><circle cx="80" cy="85" r="60" fill="#ffd34d" stroke="#e0a800" stroke-width="4"/><path d="M80 25 Q70 5 88 8" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="75" rx="9" ry="12" fill="#2b2350"/><ellipse cx="100" cy="75" rx="9" ry="12" fill="#2b2350"/><path d="M58 105 Q80 125 102 105" stroke="#2b2350" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div><div class="card"><h2>Brain Quiz</h2><p>🪙 ' + S.coins + ' | المرحلة ' + Math.min(S.p+1, Q.length) + ' / ' + Q.length + '</p></div>' +
    debt +
    '<button class="btn p" onclick="play()">▶ ابدأ اللعب</button>' +
    '<button class="btn" onclick="map()">🗺 المراحل</button>' +
    '<button class="btn" onclick="shop2()">🛒 المتجر</button>' +
    '<button class="btn" onclick="ach()">🏆 الإنجازات</button>' +
    '<button class="btn" onclick="settings2()">⚙ الإعدادات</button>' +
    '<button class="btn" onclick="daily()">🎁 المكافأة اليومية (+20 🪙)</button>' +
    '<div class="card"><p>الغلط بيخصم فلوس، ورصيدك ممكن ينزل بالسالب. حل مرحلة جديدة بيكسب 5 🪙، وإعادة مرحلة قديمة بتكسب 8 🪙 بس لو رصيدك سالب.</p></div>';
}

function map(){
  let h = '<div class="top"><button class="btn small" onclick="menu()">رجوع</button><span>🪙 ' + S.coins + '</span></div><div class="card"><div class="lv-grid">';
  for(let i = 0; i < Q.length; i++){
    const lock = i > S.p || (i === S.p && S.coins < 0);
    h += '<button class="lv ' + (lock ? 'lock' : '') + '" ' + (lock ? 'disabled' : '') + ' onclick="play(' + i + ')">' + (i+1) + (S.best[i] ? '⭐' : '') + '</button>';
  }
  h += '</div></div>';
  $('app').innerHTML = h;
}

function play(i){
  if(i === undefined) i = S.p;
  if(i > S.p || (i === S.p && S.coins < 0)){
    msg(i > S.p ? 'لازم تحل المراحل اللي قبلها الأول' : 'رصيدك سالب، لازم تعيد مرحلة قديمة');
    return map();
  }
  cur = i; hintsUsed = 0; locked = false; roundToken++;
  prepareOptions(Q[cur]);
  draw();
}

function draw(){
  const x = Q[cur];
  const rep = cur < S.p;
  $('app').innerHTML =
    '<div class="top"><span>المرحلة ' + (cur+1) + (rep ? ' (إعادة)' : '') + '</span><span>🪙 ' + S.coins + '</span></div>' +
    '<div class="card"><h2>' + x.q + '</h2>' +
    currentOptions.map((t,k) => '<button class="btn" onclick="ans(' + k + ')">' + t + '</button>').join('') +
    '<p id="fb"></p><div id="hint" class="hint" style="display:none"></div></div>' +
    '<button class="btn" id="hb" onclick="hint()">💡 تلميح (' + HC[hintsUsed] + ' 🪙)</button>' +
    '<button class="btn small" onclick="menu()">🏠 القائمة</button>';
}

function fb(m, ok){ const f = $('fb'); if(f){ f.textContent = m; f.style.color = ok ? '#15803d' : '#b91c1c'; } }

function ans(k){
  if(locked) return;
  const x = Q[cur];
  const btns = document.querySelectorAll('.btn');
  if(k === currentAnswer){ win(); }
  else {
    btns[k].classList.add('bad');
    btns[k].disabled = true;
    lose();
  }
}

function hint(){
  const x = Q[cur];
  if(hintsUsed >= 3 || locked) return;
  const c = HC[hintsUsed];
  if(!(S.free>0) && S.coins < c){ fb('فلوسك مش كفاية للتلميح', false); return; }
  if(S.free>0){S.free--}else{S.coins -= c} hintsUsed++; save();
  const txt = hintsUsed < 3 ? x.h[hintsUsed-1] : 'الإجابة: ' + currentOptions[currentAnswer];
  const box = $('hint');
  box.style.display = 'block';
  box.innerHTML += '<p>💡 ' + txt + '</p>';
  const hb = $('hb');
  hb.textContent = hintsUsed < 3 ? '💡 تلميح (' + HC[hintsUsed] + ' 🪙)' : '—';
  hb.disabled = hintsUsed >= 3;
}

function win(){
  locked = true;
  const rep = cur < S.p;
  const st = hintsUsed === 0 ? 3 : hintsUsed === 1 ? 2 : 1;
  S.best[cur] = Math.max(S.best[cur] || 0, st);
  let rw = rep ? (S.coins < 0 ? 8 : 0) : 5;
  if(!rep && S.double>0){ rw *= 2; S.double--; }
  S.coins += rw;
  if(!rep) S.p++;
  save();
  beep(880); vib(40); fb('🎉 أحسنت! ' + '⭐'.repeat(st) + ' (+' + rw + ' 🪙)', true);
  const exp = cur;
  const token = roundToken;
  setTimeout(() => {
    if(roundToken !== token || cur !== exp || !locked) return;
    if(!rep && cur + 1 < Q.length && S.coins >= 0) play(cur + 1);
    else menu();
  }, 1300);
}

function lose(){
  const x = Q[cur];
  const pen = PEN(x.t);
  if(S.shield>0){S.shield--;save();fb('🛡 الدرع منعك من الخصم',true);return;}
  S.coins -= pen;
  if(S.p === 0 && S.coins < 0) S.coins = 0;
  save();
  beep(220); vib(120); fb('❌ غلط (-' + pen + ' 🪙)', false);
  if(S.coins < 0){
    locked = true;
    const token = roundToken;
    setTimeout(() => {
      if(roundToken === token && locked && S.coins < 0) menu();
    }, 1500);
  }
}

function daily(){
  const d = new Date().toDateString();
  if(S.day === d){ msg('أخدت مكافأتك النهارده، تعالى بكرة'); return; }
  S.day = d; S.coins += 20; save();
  msg('حصلت على 20 🪙');
  menu();
}

function shop(){$('app').innerHTML='<div class="top"><button class="btn small" onclick="menu()">رجوع</button><span>🪙 '+S.coins+'</span></div><div class="card"><h2>🛒 المتجر</h2><p>تلميح مجاني: أول تلميح في أي مرحلة بدون ما يتخصم منك فلوس.</p><p>عندك: '+(S.free||0)+'</p><button class="btn p" onclick="buy()">اشتري تلميح مجاني - 20 🪙</button></div>'}
function buy(){if(S.coins<20){msg('فلوسك مش كفاية 🪙');return}S.coins-=20;S.free=(S.free||0)+1;save();shop()}
function ach(){const L=[[1,'أول لغز'],[10,'10 ألغاز'],[30,'30 لغزاً'],[60,'60 لغزاً'],[90,'90 لغزاً'],[120,'120 لغزاً'],[150,'150 لغزاً'],[400,'إكمال اللعبة']];let h='<div class="top"><button class="btn small" onclick="menu()">رجوع</button><span>الإنجازات</span></div>';L.forEach(x=>{h+='<div class="card">'+(S.p>=x[0]?'✅':'🔒')+' '+x[1]+'</div>'});$('app').innerHTML=h}
function settings(){$('app').innerHTML='<div class="top"><button class="btn small" onclick="menu()">رجوع</button><span>الإعدادات</span></div><div class="card"><h2>⚙ الإعدادات</h2><button class="btn" id="rb" onclick="resetAll()">🔄 إعادة ضبط التقدم</button></div>'}
let rstAsk=false;
function resetAll(){if(!rstAsk){rstAsk=true;const b=$('rb');if(b)b.textContent='⚠ اضغط مرة تانية للتأكيد';return}rstAsk=false;S={p:0,coins:30,best:{},day:'',free:0};save();menu()}
function shop2(){
  const it = [['🛡 درع الخطأ','يمنع خصم أول غلطة',30,'shield',S.shield||0],
              ['🎁 تلميح مجاني','أول تلميح ببلاش',20,'free',S.free||0],
              ['🔥 ضعف المكافأة','المرحلة الجديدة الجاية تكسب الضعف',25,'double',S.double||0]];
  $('app').innerHTML = `<div class="top"><button class="btn small" onclick="menu()">رجوع</button><span>🪙 ${S.coins}</span></div>` +
    it.map(x => `<div class="card"><h2>${x[0]}</h2><p>${x[1]}</p><p>عندك: ${x[4]}</p><button class="btn p" onclick="buyItem('${x[3]}',${x[2]})">اشتري - ${x[2]} 🪙</button></div>`).join('');
}
function buyItem(k, c){
  if(S.coins < c){ msg('فلوسك مش كفاية 🪙'); return; }
  S.coins -= c; S[k] = (S[k]||0) + 1; save(); shop2();
}
function settings2(){
  const on = v => v !== false ? '✅ مفعّل' : '❌ مقفول';
  $('app').innerHTML = `<div class="top"><button class="btn small" onclick="menu()">رجوع</button><span>الإعدادات</span></div>
    <div class="card"><h2>⚙ الإعدادات</h2>
      <button class="btn" onclick="togg('sound')">🔊 الصوت: ${on(S.sound)}</button>
      <button class="btn" onclick="togg('vib')">📳 الاهتزاز: ${on(S.vib)}</button>
      <p>الثيم</p>
      <button class="btn" onclick="setTheme('purple')">🟣 بنفسجي</button>
      <button class="btn" onclick="setTheme('ocean')">🔵 أزرق</button>
      <button class="btn" onclick="setTheme('dark')">⚫ داكن</button>
    </div>
    <div class="card"><button class="btn" id="rb" onclick="resetAll()">🔄 إعادة ضبط التقدم</button></div>`;
}
function togg(k){ if(k === 'sound') S.sound = S.sound === false; else S.vib = S.vib === false; save(); settings2(); }
function setTheme(t){ S.theme = t; save(); applyTheme(); settings2(); }
function applyTheme(){ document.body.dataset.theme = S.theme || 'purple'; }
function beep(f){
  if(S.sound === false) return;
  try{
    const C = new (window.AudioContext || window.webkitAudioContext)();
    const o = C.createOscillator(), g = C.createGain();
    o.frequency.value = f; g.gain.value = 0.08;
    o.connect(g); g.connect(C.destination);
    o.start(); o.stop(C.currentTime + 0.15);
  }catch(e){}
}
function vib(ms){ if(S.vib !== false && navigator.vibrate) navigator.vibrate(ms); }
applyTheme();
menu();
</script>
</body>
