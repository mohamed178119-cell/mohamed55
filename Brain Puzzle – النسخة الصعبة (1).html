<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Puzzle – النسخة الصعبة</title>
<style>
:root{--bg1:#7c5cff;--bg2:#ff6fb1;--card:#ffffffee;--ink:#2b2350;--ok:#27c97a;--bad:#ff5d5d;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);display:flex;justify-content:center;min-height:100vh;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#app{width:100%;max-width:440px;padding:16px 0}
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #0002}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 5px 0 #0002;cursor:pointer;width:100%;margin:6px 0;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}
.btn.p{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;margin-bottom:8px;gap:8px}
.logo{text-align:center;color:#fff}
.mascot{font-size:72px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.opt{display:grid;gap:10px}
.opt .btn{background:#f3f0ff}
.cell{font-size:40px;text-align:center;padding:10px 4px;border-radius:14px;background:#f3f0ff;cursor:pointer;border:3px solid transparent;word-break:keep-all}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fb{min-height:28px;text-align:center;font-weight:800;font-size:18px;margin:8px 0}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.04)}}
input{width:100%;padding:14px;border-radius:14px;border:2px solid #d8d0ff;font-size:18px;text-align:right;margin-bottom:8px}
.bar{height:12px;background:#fff6;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv button{padding:10px 0;border-radius:12px;border:0;font-weight:800;background:#fff;color:var(--ink);font-size:14px}
.lv button.lock{background:#ddd;color:#888}
.lv button.neg{background:#ffe0e0}
.hintbox{display:none;background:#fff8d6;border-radius:16px;padding:12px 16px;margin:8px 0}
.hintbox p{margin:6px 0}
.seq{min-height:24px;margin:8px 0;font-weight:700}
.debt{background:#ffe0e0;color:#a00;border-radius:16px;padding:10px;font-weight:700;text-align:center;margin:8px 0}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:99;animation:fall 1.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.logo{animation:fadeIn .6s ease-out}
.eye{transform-origin:center;animation:blink 3.5s infinite}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px) scale(.98)}
.cell:hover{border-color:#ffc83d}
.cell:active{transform:scale(.92)}
.lv button:active{transform:scale(.9)}
.card{transition:transform .2s}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 25%,#fff3 0 45px,transparent 46px),radial-gradient(circle at 85% 65%,#fff2 0 70px,transparent 71px),radial-gradient(circle at 40% 90%,#fff3 0 30px,transparent 31px),radial-gradient(circle at 70% 15%,#fff2 0 22px,transparent 23px);animation:drift 14s ease-in-out infinite alternate;pointer-events:none;z-index:-1}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-30px)}}
.big{background:linear-gradient(#ffe066,#ff9f1c);color:#fff;font-size:24px;padding:20px;text-shadow:0 2px 0 #0003;box-shadow:0 7px 0 #c46a00}
.speech{position:relative;background:#fff;border-radius:18px;padding:10px 16px;margin:12px auto 0;max-width:280px;font-weight:700;color:var(--ink);animation:fadeIn .8s .3s both}
.speech::after{content:'';position:absolute;top:-10px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
body[data-w='0']{background:linear-gradient(160deg,#7c5cff,#ff6fb1)}
body[data-w='1']{background:linear-gradient(160deg,#ff9f1c,#ff4d6d)}
body[data-w='2']{background:linear-gradient(160deg,#2a9d8f,#264653)}
body[data-w='3']{background:linear-gradient(160deg,#06d6a0,#118ab2)}
body[data-w='4']{background:linear-gradient(160deg,#8338ec,#3a0ca3)}
body[data-w='5']{background:linear-gradient(160deg,#e63946,#780000)}
body[data-w='6']{background:linear-gradient(160deg,#f9c74f,#f3722c)}
body[data-w='7']{background:linear-gradient(160deg,#0b0c10,#45007a)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.opt .btn{animation:slideIn .4s both}
.opt .btn:nth-child(2){animation-delay:.08s}
.opt .btn:nth-child(3){animation-delay:.16s}
.opt .btn:nth-child(4){animation-delay:.24s}
.trophy{font-size:90px;animation:bob 1.5s infinite;display:inline-block}
.ov{position:fixed;inset:0;background:#1a0f3dcc;display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .2s ease-out}
@keyframes pop2{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.box{background:linear-gradient(160deg,#fff,#fff6fb);color:var(--ink);border-radius:26px;padding:22px 20px 18px;max-width:330px;width:88%;text-align:center;box-shadow:0 14px 40px #0006;animation:pop2 .35s cubic-bezier(.2,1.6,.4,1)}
.box .mm{font-size:58px;animation:bob 1.5s infinite;display:inline-block}
.box p{font-size:18px;font-weight:700;line-height:1.7;margin:8px 0 14px}
.box .btn{margin:6px 0}
.card .top{color:var(--ink);text-shadow:none}
.logo p{color:#fff;font-size:19px;font-weight:700;text-shadow:0 2px 8px #3a0ca3aa;margin:4px 0 0}
.speech{color:#2b2350;font-size:17px;box-shadow:0 6px 16px #0003}
</style>
</head>
<body>
<div id="app"></div>
<script>
const K='brainpuzzle_hard_v1';
const TOTAL=400;
const HCOST=[5,10,15];
const WORLD_NAMES=['التفكير البسيط','الخدع الذكية','الرياضيات والمنطق','الصور والأشكال','الألغاز الغريبة','التحديات الصعبة','العبقرية','المستحيل'];
const NEW_REWARD=5;     // مكافأة حل مرحلة جديدة
const REPLAY_REWARD=8;   // مكافأة إعادة مرحلة قديمة (أقل)
const penalty=i=>5+Math.floor(i/50)*3; // الغلط بيخصم، والخصم بيزيد مع العوالم

/* ===== بيانات المراحل (الدفعة الأولى من النسخة الصعبة) =====
   t: choice اختيار | text كتابة | tap نقر | order ترتيب
   a: الإجابة | h: تلميحان والتالت يكشف الحل */
const LEVELS=[
 {title:'الشمعة',t:'text',q:'ما الشيء الذي كلما كبر عمره قصر جسمه؟',a:['الشمعة','شمعه'],h:['تنير الغرفة وتذوب.','ضوؤها يحتاج لشيء يحترق.']},
 {title:'الكرات الثلاث',t:'choice',q:'في صندوق 5 كرات حمراء و3 زرقاء. كم كرة يجب أن تسحب على الأقل لتضمن أن تكون بينها كرة حمراء؟',o:['1','2','3','4'],a:3,h:['فكّر في أسوأ حظ ممكن.','لو سحبت كل الزرقاء أولاً، ماذا يحدث؟']},
 {title:'الأب والابن',t:'text',q:'عمر الأب والابن معًا 50 سنة، والأب أكبر من الابن بـ 30 سنة. كم عمر الابن؟',a:['10','١٠'],h:['اجمع المعادلتين.','المعادلة: أ + ب = 50 و أ - ب = 30.']},
 {title:'ما يُكسر',t:'choice',q:'ما الشيء الذي يُكسر ولو لم يُلمس أبدًا؟',o:['الزجاج','الوعد','الصمت','الحجر'],a:1,h:['ليس شيئًا ماديًا.','تقطعه بكلمة، لا بيد.']},
 {title:'ترتيب الحروف',t:'order',q:'رتّب الحروف حسب الأبجدية العربية من البداية بالنقر بالترتيب',o:['ت','ب','أ','ث'],a:[2,1,0,3],h:['الحرف الأول هو الهمزة.','بعد الألف تأتي الباء.']},
 {title:'المختلف في النمط',t:'tap',q:'اضغط على الرقم الذي يكسر النمط',o:['3','6','9','12','14','15'],a:4,h:['كل الأرقام مضاعفات للثلاثة ماعدا واحد.','ابحث عن الرقم اللي مش مضاعف للثلاثة.']},
 {title:'مرور الوقت',t:'text',q:'ما الشيء الذي تراه كل يوم ولا يمكنك رؤيته أبدًا؟',a:['المستقبل'],h:['هو دايمًا قدامك ولسه ماجاش.','يبدأ بحرف الميم.']},
 {title:'المسافة',t:'choice',q:'قطار يسير بسرعة ثابتة 60 كم في الساعة. كم كيلومترًا يقطع في 2.5 ساعة؟',o:['120','130','150','160'],a:2,h:['اضرب السرعة في الزمن.','60 × 2 = 120، والنصف ساعة تضيف 30.']},
 {title:'الطرح المتكرر',t:'text',q:'كم مرة تستطيع أن تطرح العدد 5 من العدد 25 بالتتالي (حتى يصل إلى صفر أو أقل)؟',a:['5','٥','خمسه','خمسة'],h:['ابدأ بـ 25 واطرح 5 مرة بعد مرة.','لاحظ متى تصل إلى الصفر.']},
 {title:'الدخيل',t:'tap',q:'اضغط على الكلمة التي تختلف في المعنى',o:['كبير','ضخم','صغير','عملاق'],a:2,h:['الثلاثة الأولى تدل على الحجم الكبير.','الكلمة المختلفة عكس معناهم.']},
 {title:'متتالية فيبوناتشي',t:'text',q:'أكمل المتتالية: 1، 1، 2، 3، 5، 8، ...',a:['13','١٣'],h:['كل رقم يساوي مجموع اللي قبله رقمين.','5 + 8 = ؟']},
 {title:'الحرارة',t:'choice',q:'لو وضعت ماءً في الثلاجة لمدة 3 أيام، ماذا يحدث له غالبًا؟',o:['يغلي','يتجمد','يتبخر','يختفي'],a:1,h:['الثلاجة باردة.','الماء يتحول لثلج.']},
 {title:'الترتيب التنازلي',t:'order',q:'رتّب الأعداد من الأكبر إلى الأصغر بالنقر بالترتيب',o:['0.5','0.05','5','0.55'],a:[2,3,0,1],h:['5 أكبر من الكل.','قارن 0.55 مع 0.5 رقمًا بعد رقم.']},
 {title:'العددان',t:'text',q:'عددان مجموعهما 9 وحاصل ضربهما 20. ما أصغرهما؟',a:['4','٤','اربعه','أربعة'],h:['جرّب أعدادًا صحيحة صغيرة.','الأزواج التي حاصل ضربها 20: 1×20، 2×10، 4×5.']},
 {title:'ما الذي لا يُعد',t:'choice',q:'ما الشيء الذي يمكنك أن تحفظه ولا يمكنك أن تكسره؟ (أي من الأشياء ليست ماديّة)',o:['الكلمة','الكرسي','الكتاب','الطاولة'],a:0,h:['لا يمكن أن تمسكه.','تقوله وتبقى معناه.']}
,
 {title:'البيانو',t:'text',q:'ما الشيء الذي له مفاتيح ولا يفتح الأبواب؟',a:['البيانو','بيانو','الكيبورد'],h:['ستجده في الموسيقى.','تضرب عليه بأصابعك.']},
 {title:'الأخوات',t:'choice',q:'عائلة فيها 7 أولاد، وكل ولد له أخت واحدة فقط. كم عدد البنات في العائلة؟',o:['1','2','7','8'],a:0,h:['فكّر كم أخت لكل ولد.','الأخت الواحدة مشتركة بين الجميع.']},
 {title:'الطيران',t:'tap',q:'اضغط على الكائن الذي لا يطير',o:['نسر','ببغاء','خفاش','سمكة'],a:3,h:['معظم هذه الكائنات تطير.','ماذا تفعل السمكة بالضبط؟']},
 {title:'ترتيب العمليات',t:'text',q:'ما ناتج: 2 + 2 × 2 ؟ (انتبه للترتيب)',a:['6','٦','ستة'],h:['الضرب يسبق الجمع.','اضرب 2 × 2 أولاً.']},
 {title:'الأصغر',t:'order',q:'رتّب الأعداد من الأصغر إلى الأكبر (انتبه للسالب)',o:['12','-3','0','7'],a:[1,2,3,0],h:['السالب أصغر من الصفر.','الصفر يأتي بعد السالب مباشرة.']},
 {title:'النمط',t:'choice',q:'أي رقم يكمل النمط: 2، 6، 12، 20، ...؟',o:['24','28','30','32'],a:2,h:['انظر إلى الفرق بين كل رقمين.','الفرق القادم هو 10.']},
 {title:'الرقم السري',t:'text',q:'ما العدد الذي إذا ضربته في نفسه ثم طرحت منه 6 تحصل على 10؟',a:['4','٤','اربعه','أربعة'],h:['جرّب أعدادًا صغيرة.','16 - 6 = 10.']},
 {title:'المربع الدخيل',t:'tap',q:'اضغط على الرقم الذي لا يمكن أن يكون مربعًا كاملًا',o:['4','9','16','20','25','36'],a:3,h:['المربع الكامل ناتج ضرب عدد في نفسه.','فكّر: أي رقم لا يأتي من ضرب عدد في نفسه؟']},
 {title:'التشبيه',t:'choice',q:'الطبيب : المستشفى :: المعلم : ؟',o:['الكتاب','المدرسة','الطباشير','السبورة'],a:1,h:['المستشفى مكان عمل الطبيب.','مكان عمل المعلم هو المكان الذي يُدرّس فيه.']},
 {title:'الغنم',t:'text',q:'رجل يملك 10 أغنام، ماتت كلها إلا 9. كم غنمة بقيت؟',a:['9','٩','تسعه','تسعة'],h:['اقرأ السؤال مرة تانية بتركيز.','الجملة قالت إلا كام؟']},
 {title:'الأسبوع',t:'choice',q:'لو كان اليوم الاثنين، فما اليوم بعد 100 يوم؟',o:['الأحد','الثلاثاء','الأربعاء','الخميس'],a:2,h:['كل 7 أيام تعود لنفس اليوم.','100 = 14 × 7 + 2.']},
 {title:'الأقواس',t:'text',q:'ما ناتج: 3 × (4 + 5) − 6 ÷ 2 ؟',a:['24','٢٤'],h:['ابدأ بالأقواس.','احسب 6 ÷ 2 قبل الطرح.']},
 {title:'الحيوان الخفي',t:'choice',q:'أي هذه الكائنات ليس له عظام؟',o:['الدلفين','الأخطبوط','الحصان','الأسد'],a:1,h:['الباقي كلهم ثدييات لها عظام.','له ثمانية أذرع.']},
 {title:'كوب الشاي',t:'order',q:'رتّب خطوات تحضير كوب الشاي بالنقر بالترتيب',o:['اشرب','اصبّ الماء المغلي','ضع الشاي','اغلِ الماء'],a:[3,2,1,0],h:['ابدأ بالماء.','الشرب يكون في الآخر.']},
 {title:'فبراير',t:'text',q:'كم يوماً في شهر فبراير في السنة الكبيسة؟',a:['29','٢٩','تسعه وعشرين','تسعة وعشرين'],h:['السنة الكبيسة تضيف يوماً.','العادي 28 يوم.']}
,
 {title:'ثلاث صناديق',t:'choice',q:'ثلاث صناديق: واحد مكتوب عليه تفاح، واحد برتقال، واحد تفاح وبرتقال. كل الملصقات خاطئة. بسحبة واحدة من صندوق واحد، كيف تعرف محتوى الصناديق الثلاثة؟',o:['اسحب من الصندوق المكتوب عليه تفاح وبرتقال','اسحب من صندوق التفاح','اسحب من صندوق البرتقال','لا يمكن معرفة ذلك'],a:0,h:['الملصق الخاطئ يعني أن الصندوق لا يحتوي على ما كُتب عليه.','ابدأ بالصندوق الذي لا يصح أن يكون مختلطاً.']},
 {title:'عقارب الساعة',t:'text',q:'خلال 24 ساعة كاملة، كم مرة تتطابق عقرب الساعات وعقرب الدقائق بالضبط؟',a:['22','٢٢'],h:['في 12 ساعة يتطابقان 11 مرة.','ضاعف 11 للـ24 ساعة.']},
 {title:'ترتيب التاريخ',t:'order',q:'رتّب الأحداث من الأقدم إلى الأحدث بالنقر بالترتيب',o:['نزول الإنسان على القمر','الثورة الصناعية','اختراع الطباعة بالحروف المتحركة','سقوط الأندلس'],a:[2,3,1,0],h:['الطباعة هي الأقدم بينهم.','القمر هو الأحدث بينهم.']},
 {title:'الأولي',t:'tap',q:'اضغط على العدد الذي لا يقبل القسمة على أي عدد من 2 إلى 9',o:['49','53','57','91','35'],a:1,h:['العدد الأولي لا يقبل القسمة إلا على 1 ونفسه.','49 و57 و91 و35 كل واحد منهم له قاسم بين 2 و9.']},
 {title:'المصافحات',t:'choice',q:'في حفلة فيها 10 أشخاص، صافح كل شخص كل الآخرين مرة واحدة فقط. كم عدد المصافحات؟',o:['40','45','50','90'],a:1,h:['كل شخص يصافح 9 أشخاص.','المصافحة بين شخصين تُحسب مرة واحدة فقط.']},
 {title:'المتتالية الصاعدة',t:'text',q:'ما الرقم التالي في المتتالية: 1، 2، 6، 24، 120، ؟',a:['720','٧٢٠'],h:['كل رقم يساوي السابق مضروباً في عدد يزيد واحداً.','120 × 6 = ؟']},
 {title:'السباق',t:'choice',q:'في سباق جري، تجاوزت الشخص الذي يحتل المركز الثاني. ما مركزك الآن؟',o:['الأول','الثاني','الثالث','الرابع'],a:1,h:['انظر إلى المركز الذي وصلت إليه بعد التجاوز.','أنت حللت مكان الشخص الذي تجاوزته.']},
 {title:'الكرة الثقيلة',t:'text',q:'عندك 8 كرات، واحدة منها أثقل قليلاً. كم وزنة على الأقل تحتاج لتعرف الكرة الأثقل بميزان ذي كفتين؟',a:['2','٢','اثنين','اثنان'],h:['كل وزنة تعطيك ثلاث نتائج محتملة.','3 × 3 = 9 وهو أكبر من 8.']},
 {title:'ترتيب القوى',t:'order',q:'رتّب هذه الأعداد من الأصغر إلى الأكبر بالنقر بالترتيب',o:['2^10','3^6','5^4','6^3'],a:[3,2,1,0],h:['الأس الكبير لا يعني دائماً الأكبر.','2^10 = 1024، احسب الباقي بنفسك.']},

/* ===== الحفظ ===== */
function load(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load()||{p:0,coins:30,best:{},sound:true,vib:false};
if(S.p===0&&S.coins<0)S.coins=0;

/* ===== حالة اللعب ===== */
let cur=0,hintsUsed=0,seq=[],locked=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).trim().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();

/* ===== أصوات واهتزاز ===== */
let AC=null;
function beep(f,d){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.12))}catch(e){}}
function vib(ms){if(S.vib&&navigator.vibrate)navigator.vibrate(ms)}

/* ===== قواعد الفلوس =====
   - الغلط بيخصم، والرصيد ممكن ينزل بالسالب.
   - لو الرصيد سالب مش هتقدر تبدأ مرحلة جديدة، لازم تعيد مرحلة قديمة تكسب منها فلوس.
   - التلميحات بتتدفع من الرصيد الموجب بس. */
function canPlayNew(){return S.coins>=0}
function isLocked(i){return i>S.p || (i===S.p && !canPlayNew())}

/* ===== الواجهات ===== */
function menu(){
  const pct=Math.round(S.p/TOTAL*100);document.body.dataset.w=Math.min(Math.floor(S.p/50),7);
  const debt=S.coins<0?`<div class="debt">رصيدك بالسالب 💀 لازم تعيد مرحلة قديمة عشان تكسب فلوس</div>`:'';
  $('app').innerHTML=`
  <div class="logo"><svg class='mascot' viewBox='0 0 160 160' width='150' height='150'><circle cx='80' cy='85' r='60' fill='#ffd34d' stroke='#e0a800' stroke-width='4'/><path d='M80 25 Q70 5 88 8' stroke='#2b2350' stroke-width='4' fill='none' stroke-linecap='round'/><ellipse class='eye' cx='60' cy='75' rx='9' ry='12' fill='#2b2350'/><ellipse class='eye' cx='100' cy='75' rx='9' ry='12' fill='#2b2350'/><circle cx='63' cy='71' r='3' fill='#fff'/><circle cx='103' cy='71' r='3' fill='#fff'/><path d='M58 105 Q80 125 102 105' stroke='#2b2350' stroke-width='5' fill='none' stroke-linecap='round'/><circle cx='48' cy='98' r='7' fill='#ff7aa8' opacity='.6'/><circle cx='112' cy='98' r='7' fill='#ff7aa8' opacity='.6'/></svg><h1>Brain Puzzle</h1><p>النسخة الصعبة</p><div class="speech">يلا نشوف ذكاءك النهارده؟ 🧠</div></div>
  <div class="card"><div class="top"><span>🪙 ${S.coins}</span><span>المرحلة ${Math.min(S.p+1,TOTAL)} / ${TOTAL}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>
  ${debt}${S.p>=TOTAL?endCard():''}
  <button class="btn big" onclick="play()">▶ ابدأ اللعب</button>
  <button class="btn" onclick="map()">🗺 المراحل</button>
  <button class="btn" onclick="daily()">🎁 المكافأة اليومية (+20 🪙)</button>
  <button class="btn" onclick="shop2()">🛒 المتجر</button>
  <button class="btn" onclick="achPage()">🏆 الإنجازات</button>
  <button class="btn" onclick="settings()">⚙ الإعدادات</button>
  <div class="card"><b>قواعد الفلوس:</b><p>كل إجابة غلط تخصم من رصيدك. حل مرحلة جديدة يكسبك ${NEW_REWARD} 🪙، وإعادة مرحلة قديمة تكسب فلوس بس لو رصيدك سالب. لو رصيدك سالب، لازم تعيد مراحل قديمة لحد ما ترجع للموجب.</p></div>`;
}

function map(){document.body.dataset.w=Math.min(Math.floor(S.p/50),7);
  let h=`<div class="top"><button class="btn" style="width:auto;margin:0" onclick="menu()">رجوع</button><span>🪙 ${S.coins}</span></div>`;
  for(let w=0;w<8;w++){
    h+=`<div class="card"><b>العالم ${w+1}: ${WORLD_NAMES[w]}</b><div class="lv" style="margin-top:10px">`;
    for(let i=w*50;i<w*50+50;i++){
      const lock=isLocked(i);
      h+=`<button class="${lock?'lock':''}" ${lock?'disabled':''} onclick="play(${i})">${i+1}${S.best[i]?'⭐':''}</button>`;
    }
    h+='</div></div>';
  }
  $('app').innerHTML=h;
}

function settings(){
  $('app').innerHTML=`
  <div class="top"><button class="btn" style="width:auto;margin:0" onclick="menu()">رجوع</button><span>الإعدادات</span></div>
  <div class="card">
    <label><input type="checkbox" style="width:auto" ${S.sound?'checked':''} onchange="S.sound=this.checked;save()"> الأصوات</label><br><br>
    <label><input type="checkbox" style="width:auto" ${S.vib?'checked':''} onchange="S.vib=this.checked;save()"> الاهتزاز</label>
  </div>
  <button class="btn" onclick="resetAll()">🔄 إعادة ضبط التقدم</button>
  <div class="card"><p>الدفعة الحالية: 15 مرحلة صعبة. باقي المراحل قيد الإضافة.</p></div>`;
}

function resetAll(){ask('متأكد؟ هيتم مسح كل التقدم',doReset)}
function doReset(){
  if(true){
    S={p:0,coins:30,best:{},sound:S.sound,vib:S.vib};
    save(); menu();
  }
}

function daily(){
  const d=new Date().toDateString();
  if(S.day===d){msg('أخدت مكافأتك النهارده، تعالى بكرة 🎁');return;}
  S.day=d; S.coins+=20; save();
  msg('حصلت على 20 🪙 تم إضافتها لرصيدك','🎁');
  menu();
}

/* ===== اللعب ===== */
function play(i){
  if(i===undefined)i=S.p;
  if(i>S.p || (i===S.p && !canPlayNew())){
    msg(i>S.p ? 'لازم تحل المراحل اللي قبلها الأول' : 'رصيدك سالب، لازم تعيد مرحلة قديمة تكسب منها فلوس');
    map(); return;
  }
  cur=i; hintsUsed=0; seq=[]; locked=false; dsel=-1; dmap=[];
  draw();
}

function draw(){
  const l=LEVELS[cur];
  if(!l){
    $('app').innerHTML=`<div class="card"><h2>🚧 المرحلة ${cur+1}</h2><p>هذه المرحلة قيد الإضافة في الدفعة الجاية.</p></div>
    <button class="btn" onclick="menu()">🏠 القائمة</button>`;
    return;
  }
  const wi=Math.floor(cur/50);document.body.dataset.w=wi;
  const isReplay=cur<S.p;
  let body='';
  if(l.t==='choice') body=`<div class="opt">${l.o.map((x,i)=>`<button class="btn" onclick="ans(${i})">${esc(x)}</button>`).join('')}</div>`;
  if(l.t==='tap') body=`<div class="grid">${l.o.map((x,i)=>`<div class="cell" style="font-size:${x.length>2?18:40}px" onclick="ans(${i})">${esc(x)}</div>`).join('')}</div>`;
  if(l.t==='order') body=`<div class="opt">${l.o.map((x,i)=>`<button class="btn" ${seq.includes(i)?'disabled':''} onclick="pick(${i})">${esc(x)}</button>`).join('')}</div>
    <div class="seq">الترتيب الحالي: ${seq.map(i=>esc(l.o[i])).join(' ← ')||'—'}</div>
    <button class="btn" onclick="resetSeq()">↺ إعادة الترتيب</button>`;
  if(l.t==='drag') body=`<p>اضغط العنصر وبعدين على مكانه</p><div class='grid'>${l.items.map((x,i)=>`<div class='cell' style='font-size:30px;${dsel===i?'border-color:#ffc83d;':''}${dmap[i]!==undefined?'opacity:.45':''}' onclick='dragItem(${i})'>${x.e}<br><small style='font-size:13px'>${esc(x.n)}</small></div>`).join('')}</div><div class='grid' style='margin-top:12px'>${l.targets.map((x,j)=>`<div class='cell' style='font-size:30px' onclick='dragTarget(${j})'>${x.e}<br><small style='font-size:13px'>${esc(x.n)}</small></div>`).join('')}</div>`;
  if(l.t==='hold') body=`<button id='hb2' class='btn p' style='font-size:22px;padding:34px' onmousedown='holdStart()' onmouseup='holdEnd()' onmouseleave='holdEnd()' ontouchstart='holdStart()' ontouchend='holdEnd()'>امسك هنا</button>`;
  if(l.t==='text') body=`<input id="tx" placeholder="اكتب إجابتك" onkeydown="if(event.key==='Enter')ansText()"><button class="btn p" onclick="ansText()">تحقق</button>`;

  $('app').innerHTML=`
  <div class="top"><span>العالم ${wi+1}: ${WORLD_NAMES[wi]}</span><span id="coins">🪙 ${S.coins}</span></div>
  <div class="card pop" id="card"><h2>المرحلة ${cur+1} ${isReplay?'<small>(إعادة)</small>':''}</h2><p style="font-size:19px;line-height:1.7">${esc(l.q)}</p>${body}<div id="fb" class="fb"></div></div>
  <button class="btn" id="hb" onclick="hint()" ${hintsUsed>=3?'disabled':''}>💡 تلميح (${HCOST[hintsUsed]||'—'} 🪙)</button>
  <div id="hint" class="hintbox"></div>
  <button class="btn" onclick="menu()">🏠 القائمة</button>`;
}

function answerText(l){
  if(l.t==='drag') return l.a.map((t,k)=>l.items[k].n+' ← '+l.targets[t].n).join('، ');
  if(l.t==='hold') return 'امسك الزرار لحد المدة المطلوبة';
  if(l.t==='order') return l.a.map(i=>l.o[i]).join(' ← ');
  if(l.t==='text') return l.a[0];
  return l.o[l.a];
}

function hint(){
  const l=LEVELS[cur];
  if(!l||hintsUsed>=3)return;
  const c=HCOST[hintsUsed];
  if(S.coins<c&&!(S.freeHint>0)){fb('ما عندكش فلوس كفاية للتلميح 🪙',false);return;}
  const wasFree=S.freeHint>0; if(wasFree){S.freeHint--}else{S.coins-=c} hintsUsed++; save();
  const txt=hintsUsed<3?l.h[hintsUsed-1]:'الإجابة: '+answerText(l);
  const box=$('hint');
  box.style.display='block';
  box.innerHTML+=`<p>💡 ${esc(txt)} <small>(${wasFree?'مجاني':'-'+c+' 🪙'})</small></p>`;
  const hb=$('hb');
  hb.innerHTML=hintsUsed<3?`💡 تلميح (${HCOST[hintsUsed]} 🪙)`:'—';
  hb.disabled=hintsUsed>=3;
  $('top')||0;
  updCoins();
  fb('🪙 رصيدك: '+S.coins,S.coins>=0);
}

function updCoins(){const c=$('coins');if(c)c.textContent='🪙 '+S.coins}
function confetti(){const c=['#ff6fb1','#ffc83d','#27c97a','#7c5cff','#ff5d5d'];for(let i=0;i<40;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%c.length];e.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}}
const ACH=[['أول لغز',1],['10 ألغاز محلولة',10],['50 لغزاً محلولاً',50],['100 لغز محلول',100],['200 لغز محلول',200],['إكمال اللعبة بالكامل',400]];
function checkAch(){S.ach=S.ach||[];ACH.forEach(([n,c])=>{if(S.p>=c&&!S.ach.includes(n)){S.ach.push(n);setTimeout(()=>msg('🏆 إنجاز جديد: '+n,'🏆'),600)}});save()}
function achPage(){S.ach=S.ach||[];$('app').innerHTML=`<div class="top"><button class="btn" style="width:auto;margin:0" onclick="menu()">رجوع</button><span>الإنجازات</span></div>`+ACH.map(([n,c])=>`<div class="card">${S.ach.includes(n)?'✅':'🔒'} <b>${n}</b> <small>(${c} لغز)</small></div>`).join('')}
function shop(){$('app').innerHTML=`<div class="top"><button class="btn" style="width:auto;margin:0" onclick="menu()">رجوع</button><span>🪙 ${S.coins}</span></div><div class="card"><h2>🛒 المتجر</h2><p>🛡 درع الخطأ: يمنع الخصم في أول غلطة. عندك: ${S.shield||0}</p><button class="btn p" onclick="buyShield()">اشتري الدرع - 15 🪙</button></div>`}
function buyShield(){if(S.coins<15){msg('فلوسك مش كفاية 🪙');return}S.coins-=15;S.shield=(S.shield||0)+1;save();shop()}
function endCard(){const st=Object.values(S.best).reduce((a,b)=>a+b,0);return `<div class="card" style="text-align:center"><div class="trophy">🏆</div><h2>عبقري الألغاز</h2><p>حليت ${S.p} لغز</p><p>⭐ ${st} نجمة | 🪙 ${S.coins}</p><button class="btn g" onclick="resetAll()">🔁 العب من البداية</button></div>`}
function shop2(){$('app').innerHTML=`<div class='top'><button class='btn' style='width:auto;margin:0' onclick='menu()'>رجوع</button><span>🪙 ${S.coins}</span></div><div class='card'><h2>🛒 المتجر</h2><p>🛡 درع الخطأ: يمنع خصم أول غلطة. عندك: ${S.shield||0}</p><button class='btn p' onclick="buyItem('shield',30)">اشتري الدرع - 30 🪙</button><p>💡 تلميح مجاني: أول تلميح بدون خصم فلوس. عندك: ${S.freeHint||0}</p><button class='btn' onclick="buyItem('freeHint',20)">اشتري تلميح مجاني - 20 🪙</button><p>🔥 ضعف المكافأة: المرحلة الجديدة الجاية تكسب الضعف. عندك: ${S.double||0}</p><button class='btn g' onclick="buyItem('double',25)">اشتري ضعف المكافأة - 25 🪙</button></div>`}
function buyItem(k,c){if(S.coins<c){msg('فلوسك مش كفاية 🪙');return}S.coins-=c;S[k]=(S[k]||0)+1;save();shop2()}
function closeOv(){const o=document.getElementById('ovl');if(o)o.remove()}
function msg(t,emo){closeOv();const d=document.createElement('div');d.id='ovl';d.className='ov';d.innerHTML=`<div class='box'><div class='mm'>${emo||'🧠'}</div><p>${esc(t)}</p><button class='btn p' onclick='closeOv()'>حسنًا</button></div>`;document.body.appendChild(d)}
function ask(t,yes){closeOv();const d=document.createElement('div');d.id='ovl';d.className='ov';d.innerHTML=`<div class='box'><div class='mm'>❓</div><p>${esc(t)}</p><button class='btn p' id='okb'>تأكيد</button><button class='btn' onclick='closeOv()'>إلغاء</button></div>`;document.body.appendChild(d);document.getElementById('okb').onclick=()=>{closeOv();yes()}}
let dsel=-1,dmap=[],hT=0;
function dragItem(i){if(locked)return;dsel=i;draw()}
function dragTarget(j){if(locked||dsel<0)return;const l=LEVELS[cur];dmap[dsel]=j;dsel=-1;if(dmap.filter(x=>x!==undefined).length===l.items.length){const ok=l.a.every((v,k)=>dmap[k]===v);if(ok)win();else{lose();dmap=[];setTimeout(draw,700)}}else draw()}
function holdStart(){if(locked)return;hT=Date.now()}
function holdEnd(){if(locked||!hT)return;const d=Date.now()-hT;hT=0;const need=LEVELS[cur].need||1500;if(d>=need)win();else{fb('ما كفاش الضغط 😅 امسك أطول',false);shake()}}
function fb(m,ok){const f=$('fb');if(!f)return;f.textContent=m;f.style.color=ok?'#1a9e5c':'#d63b3b'}
function shake(){const c=$('card');if(!c)return;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}

function ans(i){
  if(locked)return;
  const l=LEVELS[cur];
  if(i===l.a)win(); else lose();
}

function pick(i){
  if(locked)return;
  const l=LEVELS[cur];
  seq.push(i);
  if(seq.length===l.o.length){
    if(JSON.stringify(seq)===JSON.stringify(l.a))win();
    else{seq=[];lose();setTimeout(draw,700);}
  } else draw();
}

function resetSeq(){seq=[];draw()}

function ansText(){
  if(locked)return;
  const v=norm($('tx').value);
  if(!v){fb('اكتب إجابة الأول 🙂',false);return;}
  if(LEVELS[cur].a.some(x=>norm(x)===v))win(); else lose();
}

function win(){
  locked=true;
  const isReplay=cur<S.p;
  const st=hintsUsed===0?3:hintsUsed===1?2:1;
  S.best[cur]=Math.max(S.best[cur]||0,st);
  const rw=isReplay?(S.coins<0?REPLAY_REWARD:0):(NEW_REWARD*((S.double>0)?2:1));if(!isReplay&&S.double>0)S.double--;S.coins+=rw;
  if(!isReplay)S.p++;
  save();
  updCoins();
  beep(880,.2); vib(60); confetti(); checkAch();
  fb(`🎉 أحسنت! ${'⭐'.repeat(st)}  (+${rw} 🪙)`,true);
  const cc=$('card'); if(cc)cc.classList.add('pop');
  const next=cur+1, expect=cur;
  setTimeout(()=>{
    if(cur!==expect)return;
    if(isReplay){ menu(); return; }   // بعد الإعادة نرجع للقائمة عشان نشوف الرصيد
    if(next<TOTAL && canPlayNew()) play(next); else menu();
  },1400);
}

const FUNNY=['😜 قربت! جرّب تاني','🙈 لا مش دي، فكّر بطريقة مختلفة','🤪 إجابة مضحكة بس مش صح!','🐒 حاول تاني وانت مركز'];
function lose(){
  const pen=penalty(cur);
  if(S.shield>0){S.shield--;save();fb('🛡 الدرع منعك من الخصم',true);shake();return;}
  S.coins-=pen;
  if(S.p===0&&S.coins<0)S.coins=0; // مفيش مرحلة قديمة نرجع ليها، فالرصيد ما ينزلش بالسالب
  save();
  updCoins();
  const m=FUNNY[Math.floor(Math.random()*FUNNY.length)];
  fb(`${m}  (-${pen} 🪙)`,false); shake(); beep(220,.15); vib(30);
  if(S.coins<0){locked=true;setTimeout(menu,1500);} if(S.coins<0) setTimeout(()=>{ const f=$('fb'); if(f) f.textContent+=' — رصيدك بالسالب، لازم تعيد مرحلة قديمة'; },600);
}

/* ===== بدء التطبيق ===== */
menu();
</script>
