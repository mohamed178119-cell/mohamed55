<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff6fb1"/>
    </linearGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#ffd34d"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- soft bubbles in the background -->
  <circle cx="160" cy="200" r="70" fill="#ffffff" opacity="0.15"/>
  <circle cx="880" cy="300" r="46" fill="#ffffff" opacity="0.15"/>
  <circle cx="850" cy="860" r="90" fill="#ffffff" opacity="0.12"/>
  <circle cx="170" cy="840" r="52" fill="#ffffff" opacity="0.15"/>

  <!-- antenna curl -->
  <path d="M512 262 Q462 178 530 150" stroke="#2b2350" stroke-width="28" fill="none" stroke-linecap="round"/>

  <!-- face -->
  <circle cx="512" cy="540" r="290" fill="url(#face)" stroke="#e0a800" stroke-width="24"/>

  <!-- eyes with shine -->
  <ellipse cx="410" cy="500" rx="42" ry="58" fill="#2b2350"/>
  <ellipse cx="614" cy="500" rx="42" ry="58" fill="#2b2350"/>
  <circle cx="425" cy="478" r="14" fill="#ffffff"/>
  <circle cx="629" cy="478" r="14" fill="#ffffff"/>

  <!-- cheeks -->
  <circle cx="330" cy="612" r="34" fill="#ff7aa8" opacity="0.6"/>
  <circle cx="694" cy="612" r="34" fill="#ff7aa8" opacity="0.6"/>

  <!-- smile -->
  <path d="M380 640 Q512 770 644 640" stroke="#2b2350" stroke-width="36" fill="none" stroke-linecap="round"/>

  <!-- puzzle piece badge -->
  <g transform="translate(730 760)">
    <circle cx="0" cy="0" r="92" fill="#27c97a" stroke="#ffffff" stroke-width="16"/>
    <rect x="-40" y="-40" width="80" height="80" rx="14" fill="#ffffff"/>
    <circle cx="0" cy="-40" r="22" fill="#ffffff"/>
    <circle cx="40" cy="0" r="22" fill="#ffffff"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
